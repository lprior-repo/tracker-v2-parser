name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Quality gates and Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: track_scrapper_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d track_scrapper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CARGO_TERM_COLOR: always
      TEST_DATABASE_URL: postgres://postgres:ci-only-postgres@127.0.0.1:5432/track_scrapper_test
      DATABASE_URL: postgres://postgres:ci-only-postgres@127.0.0.1:5432/track_scrapper_test
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Moon
        run: npm install --global @moonrepo/cli@2.2.4
      - name: Install checked-in Rust toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          toolchain = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']
          command = ['rustup', 'toolchain', 'install', toolchain['channel'],
                     '--profile', toolchain.get('profile', 'minimal')]
          for component in toolchain.get('components', []):
              command.extend(['--component', component])
          subprocess.run(command, check=True)
          PY
      - name: Run all quality gates
        run: moon ci --force
      - name: Package Linux release binary
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/track-scrapper-v2-x86_64-unknown-linux-gnu.tar.gz \
            -C target/release track-scrapper-v2
          (cd dist && sha256sum track-scrapper-v2-x86_64-unknown-linux-gnu.tar.gz > SHA256SUMS)
      - name: Upload Linux binary and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: track-scrapper-v2-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged GitHub release
    needs: gates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download gated Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: track-scrapper-v2-x86_64-unknown-linux-gnu
          path: dist
      - name: Verify packaged checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes \
            dist/track-scrapper-v2-x86_64-unknown-linux-gnu.tar.gz \
            dist/SHA256SUMS
