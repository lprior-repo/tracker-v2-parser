[package]
name = "track-scrapper-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Athletic.net and MileSplit recruiting data pipeline using SQLx and PostgreSQL"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
calamine = "0.37"
chromiumoxide = "=0.9.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
dotenvy = "0.15"
futures = "0.3"
lol_html = "3.0"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query", "gzip"] }
restate-sdk = { version = "=0.13.0", features = ["reqwest-client"] }
rust_xlsxwriter = { version = "0.101", features = ["constant_memory"] }
rustix = { version = "1", features = ["fs"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "fs", "process", "net", "io-util", "signal"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
let_underscore_must_use = "deny"
await_holding_lock = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
